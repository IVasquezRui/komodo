# =============================================================================
# Redis Configuration — Optimized for Ephemeral Shield Layer
# =============================================================================
# DESIGN PRINCIPLE: Redis is a volatile cache + distributed lock store.
# It is NOT a persistence layer. If Redis dies, all data is rebuildable
# from PostgreSQL via cache-aside pattern.
# =============================================================================

# ---- Network ----
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---- Security ----
requirepass komodo_redis_password

# ---- Memory Management ----
# Limit memory to 256MB — suitable for a budget VPS (1-2GB RAM total)
# In production, scale to 512MB-1GB based on available RAM
maxmemory 256mb

# When memory is full, evict LEAST RECENTLY USED keys across ALL databases
# This is safe because every key in Redis is rebuildable from PostgreSQL
maxmemory-policy allkeys-lru

# Sample 10 keys for LRU approximation (higher = more accurate, slower)
maxmemory-samples 10

# ---- Persistence (DISABLED BY DESIGN) ----
# We intentionally disable RDB snapshots and AOF.
# Rationale: On power failure, Redis restarts empty. The cache-aside pattern
# in the Go gateway repopulates keys on demand from PostgreSQL.
# This avoids disk I/O contention on cheap SSDs/HDDs and prevents
# data corruption from abrupt shutdowns.
save ""
appendonly no

# ---- Performance ----
# Lazy freeing: delete large keys in background thread to avoid blocking
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ---- Logging ----
loglevel notice
logfile ""

# ---- Connection Limits ----
# Conservative limit for budget servers
maxclients 1000

# ---- Latency Monitoring ----
# Log operations slower than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- Disable Dangerous Commands in Production ----
# Uncomment these in production to prevent accidental data wipes
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command DEBUG ""
